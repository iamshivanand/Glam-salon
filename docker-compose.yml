services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: glamconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: glam
      POSTGRES_PASSWORD: glam_dev_pw
      POSTGRES_DB: glamconnect
    ports:
      - "5433:5432"
    volumes:
      - glam_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glam -d glamconnect"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: glamconnect-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - glam_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  glam_pgdata:
  glam_redis:
